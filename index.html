<script>
if ("serviceWorker" in navigator) {
  /* 喺 localhost 開發唔註冊 service worker：免得攞到舊 cache，睇唔到啱啱改嘅嘢 */
  var devLocal = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '0.0.0.0' || location.protocol === 'file:');
  if (!devLocal) {
    addEventListener("load", function () {
      try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
    });
  }
}
try {
  if (typeof App !== "undefined" && App.init) App.init();
  else document.getElementById("view").innerHTML = "<p>載入緊…</p>";
} catch (e) {
  document.getElementById("view").innerHTML = "<p>出錯，重新整理試下。<br><small>"+(e&&e.message?e.message:e)+"</small></p>";
}
</script>
